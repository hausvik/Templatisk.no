<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Siden finnes ikke, Templatisk</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f8f9fa;
      --border: #dee2e6;
      --text: #212529;
      --muted: #5c636a;
      --primary: #0a58ca;
      --on-primary: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1d21;
        --border: #3a4048;
        --text: #e2e8f0;
        --muted: #a3b0c4;
        --primary: #82b4f7;
        --on-primary: #1a1d21;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 34rem; padding: 2rem 1.25rem; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 2rem; margin: 1rem 0 0.5rem; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 1.75rem; }
    a.btn {
      display: inline-block; padding: 0.75rem 1.4rem; border-radius: 8px;
      background: var(--primary); color: var(--on-primary); font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/logo/mark.svg" alt="" />
    <h1>Siden finnes ikke</h1>
    <p>Adressen du fulgte er feil eller siden er flyttet.</p>
    <a class="btn" href="/">Til forsiden</a>
  </main>
</body>
</html>
