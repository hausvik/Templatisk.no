<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Siden finnes ikke – Templatisk</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f8f7f4;
      --border: #ddd9d0;
      --text: #16232e;
      --muted: #526070;
      --primary: #16232e;
      --on-primary: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a22;
        --border: #2e3d4a;
        --text: #e8edf1;
        --muted: #a9b6c2;
        --primary: #f3b63f;
        --on-primary: #16232e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 34rem; padding: 2rem 1.25rem; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { font-size: 2rem; margin: 1rem 0 0.5rem; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 1.75rem; }
    a.btn {
      display: inline-block; padding: 0.75rem 1.4rem; border-radius: 8px;
      background: var(--primary); color: var(--on-primary); font-weight: 600; text-decoration: none;
    }
    .skip-link {
      position: absolute; left: 0.75rem; top: -4rem; z-index: 100;
      padding: 0.6rem 1rem; border-radius: 8px;
      background: var(--primary); color: var(--on-primary); font-weight: 600; text-decoration: none;
    }
    .skip-link:focus { top: 0.75rem; }
  </style>
</head>
<body>
  <a class="skip-link" href="#innhold">Hopp til innhold</a>
  <main id="innhold" tabindex="-1">
    <img src="/logo/mark.svg" alt="" />
    <h1>Siden finnes ikke</h1>
    <p>Adressen du fulgte er feil eller siden er flyttet.</p>
    <a class="btn" href="/">Til forsiden</a>
  </main>
</body>
</html>
